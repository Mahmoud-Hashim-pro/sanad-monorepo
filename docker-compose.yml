version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: sanad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanad_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sanad_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sanad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanad_user} -d ${POSTGRES_DB:-sanad_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sanad_pgdata:
