services:
  - type: web
    name: sanad-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: sanad-postgres
          property: connectionString
      - key: NATIONAL_ID_HMAC_PEPPER
        generateValue: true
      - key: NATIONAL_ID_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: sanad-web-preview
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: preview_mock

databases:
  - name: sanad-postgres
    databaseName: sanad_db
    user: sanad_user
    plan: starter
